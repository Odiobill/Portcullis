services:
  caddy:
    build:
      context: ./docker/caddy
      args:
        CADDY_DNS_PROVIDER: ${CADDY_DNS_PROVIDER:-}
    image: portcullis-caddy:latest
    container_name: portcullis_caddy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - /srv/sites:/srv/sites:ro
      - ./data/caddy_logs:/var/log/caddy
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - portcullis_internal
      - caddy_gateway
    environment:
      - PORTCULLIS_DOMAIN=${PORTCULLIS_DOMAIN}
      - CADDY_TLS_MODE=${CADDY_TLS_MODE}
      - CADDY_DNS_PROVIDER=${CADDY_DNS_PROVIDER:-}
      - NAMECHEAP_API_KEY=${NAMECHEAP_API_KEY:-}
      - NAMECHEAP_API_USER=${NAMECHEAP_API_USER:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    env_file:
      - .env
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    # One-shot schema setup for the fresh registry database. Dependency-
    # gated: control_plane starts only after migrations completed
    # successfully, and version tracking makes reruns safe no-ops.
    build:
      context: ./apps/control-plane
    image: portcullis-control-plane:latest
    container_name: portcullis_migrate
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    environment:
      # Only the database URL: the migrate subcommand never needs owner
      # secrets. Credentials flow via environment only.
      - PORTCULLIS_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@portcullis_db:5432/${DB_NAME}
    command: ["migrate"]  # ENTRYPOINT is control-plane; runs `control-plane migrate`
    depends_on:
      portcullis_db:
        condition: service_healthy
    networks:
      - portcullis_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  control_plane:
    # Go control plane (ADR-0001): owner dashboard, service lifecycle,
    # Caddy validate/reload, log view, read-only backup browser, optional
    # provisioning, and session-authenticated dumps. No bearer token, no
    # Prisma, no Docker socket.
    build:
      context: ./apps/control-plane
    image: portcullis-control-plane:latest
    container_name: portcullis_control_plane
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    environment:
      - PORTCULLIS_PASSCODE=${PORTCULLIS_PASSCODE}
      - PORTCULLIS_SESSION_SECRET=${PORTCULLIS_SESSION_SECRET}
      - PORTCULLIS_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@portcullis_db:5432/${DB_NAME}
    volumes:
      # Validate/reload reads the root Caddyfile — never writable here.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated Caddyfiles are written by the control plane...
      - ./sites/generated:/etc/caddy/sites/generated
      # ...while operator-manual blocks are read-only to it.
      - ./sites/manual:/etc/caddy/sites/manual:ro
      # Caddy CLI validation opens configured log writers, so this must be
      # writable; the log reader consumes the same files read-only.
      - ./data/caddy_logs:/var/log/caddy
      # Backups are read-only to the control plane.
      - backup_data:/backups:ro
    depends_on:
      portcullis_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - portcullis_internal
      - caddy_gateway
      - db_network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  portcullis_db:
    image: postgres:18-alpine
    container_name: portcullis_db
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/pg_data:/var/lib/postgresql
    networks:
      - portcullis_internal
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    profiles:
      - backup
    build:
      context: ./docker/backup
    image: portcullis-backup:latest
    container_name: portcullis_backup
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      - PGHOST=portcullis_db
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - MANAGER_DB=${DB_NAME}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-7}
      - RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-4}
      - RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-3}
    volumes:
      - backup_data:/backups
    networks:
      - db_network
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  portcullis_internal:
    driver: bridge
  caddy_gateway:
    external: true
  db_network:
    external: true

volumes:
  backup_data:
