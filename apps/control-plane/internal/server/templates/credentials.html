<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database credentials — Portcullis</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #101418; color: #e6e6e6; margin: 0; }
    header { padding: 1rem 2rem; background: #1a2026; }
    main { padding: 2rem; max-width: 36rem; }
    .warn { color: #fbbf24; }
    dl { background: #1a2026; padding: 1rem 1.5rem; border-radius: 8px; }
    dt { font-size: 0.8rem; color: #9ca3af; margin-top: 0.75rem; }
    dd { font-family: monospace; font-size: 1.05rem; margin: 0.15rem 0 0; word-break: break-all; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <header><h1>Database credentials</h1></header>
  <main>
    <p class="warn"><strong>Save this password now.</strong> It is shown only once, is never stored by Portcullis, and cannot be displayed again.</p>
    <dl>
      <dt>Database</dt><dd>{{.DBName}}</dd>
      <dt>User</dt><dd>{{.DBUser}}</dd>
      <dt>Password</dt><dd><code>{{.Password}}</code></dd>
    </dl>
    <p><a href="/dashboard">Back to dashboard</a></p>
  </main>
</body>
</html>
